<!DOCTYPE html>
<html>
<head>
  <title>Seasons Kitchen</title>
  <style>
    body { font-family: Arial; padding: 20px; text-align: center; }
    .menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    .item { border: 1px solid #ccc; padding: 10px; border-radius: 10px; }
    img { width: 100%; cursor: pointer; border-radius: 10px; }
    button { padding: 10px; background: green; color: white; border: none; margin-top: 20px; }
  </style>
</head>

<body>

<h2>🍴 Seasons Kitchen Menu</h2>

<div class="menu">

<div class="item">
  <img src="https://via.placeholder.com/150" onclick="addItem('Burger',1200)">
  <p>🍔 Burger - ₦1200</p>
</div>

<div class="item">
  <img src="https://via.placeholder.com/150" onclick="addItem('Pizza',2500)">
  <p>🍕 Pizza - ₦2500</p>
</div>

<div class="item">
  <img src="https://via.placeholder.com/150" onclick="addItem('Fries',800)">
  <p>🍟 Fries - ₦800</p>
</div>

<div class="item">
  <img src="https://via.placeholder.com/150" onclick="addItem('Shawarma',1500)">
  <p>🌯 Shawarma - ₦1500</p>
</div>

</div>

<h3>Your Order</h3>
<ul id="list"></ul>
<h3>Total: ₦<span id="total">0</span></h3>

<button onclick="sendOrder()">Send via WhatsApp</button>

<script>
let order = [];
let total = 0;

function addItem(name, price){
  order.push({name, price});
  total += price;
  update();
}

function update(){
  let list = document.getElementById("list");
  list.innerHTML = "";
  order.forEach(item => {
    let li = document.createElement("li");
    li.textContent = item.name + " - ₦" + item.price;
    list.appendChild(li);
  });
  document.getElementById("total").textContent = total;
}

function sendOrder(){
  let msg = "Hello, I want to order:%0A";
  order.forEach(item => {
    msg += "- " + item.name + " ₦" + item.price + "%0A";
  });
  msg += "Total: ₦" + total;

  window.open("https://wa.me/2348180149672?text=" + msg);
}
</script>

</body>
</html>
